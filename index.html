<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Stock Tracker (500+ Equities)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
          Live Global Stock Tracker
        </h1>
        <p class="text-xs text-slate-400">Monitoring 500 S&P 500 & Nasdaq market equities</p>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search ticker or name..." 
          class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 w-full sm:w-64"
        />
        <input 
          type="password" 
          id="apiKeyInput" 
          placeholder="Finnhub API Key (Optional)" 
          class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 w-full sm:w-48"
        />
        <button id="connectBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition">
          Connect API
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs font-medium text-slate-400">Tracked Tickers</p>
        <p class="text-2xl font-bold text-white mt-1" id="totalTickers">500</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs font-medium text-slate-400">Data Source</p>
        <p class="text-sm font-semibold text-amber-400 mt-2" id="sourceStatus">Simulated Real-Time</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs font-medium text-slate-400">Gainers / Losers</p>
        <p class="text-sm font-semibold text-slate-200 mt-2">
          <span class="text-emerald-400" id="gainerCount">0</span> / 
          <span class="text-rose-400" id="loserCount">0</span>
        </p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs font-medium text-slate-400">Updates / Sec</p>
        <p class="text-2xl font-bold text-indigo-400 mt-1" id="ticksPerSec">0</p>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-800/60 text-slate-400 uppercase text-xs">
            <tr>
              <th class="py-3 px-4">Symbol</th>
              <th class="py-3 px-4">Company Name</th>
              <th class="py-3 px-4 text-right">Price ($)</th>
              <th class="py-3 px-4 text-right">Change ($)</th>
              <th class="py-3 px-4 text-right">Change (%)</th>
              <th class="py-3 px-4 text-right">Volume</th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-slate-800 font-mono text-xs">
            </tbody>
        </table>
      </div>

      <div class="p-4 border-t border-slate-800 flex justify-between items-center text-sm text-slate-400">
        <span id="pageInfo">Showing 1 to 20 of 500 stocks</span>
        <div class="flex gap-2">
          <button id="prevBtn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 disabled:opacity-50">Prev</button>
          <button id="nextBtn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 disabled:opacity-50">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 1. Generate 500 Stock Symbols and Base Data
    const symbols = [
      "AAPL","MSFT","NVDA","AMZN","GOOGL","META","TSLA","BRK.B","UNH","JNJ","JPM","V","XOM","PG","MA","HD","CVX","MRK","ABBV","COST",
      "PEP","KO","ADB","WMT","MCD","CSCO","ACN","TMO","BAC","LIN","ABT","AMD","ORCL","PM","CRM","NFLX","INTC","DHR","TXN","WFC"
    ];
    
    // Fill array up to 500 generated equities
    for (let i = symbols.length; i < 500; i++) {
      symbols.push(`STK${i}`);
    }

    const stockMap = new Map();
    symbols.forEach(sym => {
      const basePrice = Math.floor(Math.random() * 300) + 20;
      stockMap.set(sym, {
        symbol: sym,
        name: sym.startsWith("STK") ? `Company Equities ${sym}` : `${sym} Corp`,
        price: basePrice,
        prevClose: basePrice + (Math.random() * 4 - 2),
        volume: Math.floor(Math.random() * 500000) + 10000,
        lastUpdated: Date.now()
      });
    });

    // App State
    let currentPage = 1;
    const pageSize = 20;
    let filteredSymbols = [...symbols];
    let tickCount = 0;
    let socket = null;

    // 2. Render Functions
    const tableBody = document.getElementById("stockTableBody");
    const pageInfo = document.getElementById("pageInfo");

    function renderTable() {
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredSymbols.slice(start, end);

      tableBody.innerHTML = pageData.map(sym => {
        const item = stockMap.get(sym);
        const diff = item.price - item.prevClose;
        const pct = (diff / item.prevClose) * 100;
        const isUp = diff >= 0;
        const colorClass = isUp ? "text-emerald-400" : "text-rose-400";
        const bgFlash = item.flash ? (item.flash === 'up' ? 'bg-emerald-950/40' : 'bg-rose-950/40') : '';

        return `
          <tr class="hover:bg-slate-800/40 transition-colors ${bgFlash}">
            <td class="py-3 px-4 font-bold text-slate-100">${item.symbol}</td>
            <td class="py-3 px-4 text-slate-400 font-sans">${item.name}</td>
            <td class="py-3 px-4 text-right font-semibold text-slate-100">$${item.price.toFixed(2)}</td>
            <td class="py-3 px-4 text-right ${colorClass}">${isUp ? '+' : ''}${diff.toFixed(2)}</td>
            <td class="py-3 px-4 text-right ${colorClass}">${isUp ? '+' : ''}${pct.toFixed(2)}%</td>
            <td class="py-3 px-4 text-right text-slate-400">${item.volume.toLocaleString()}</td>
          </tr>
        `;
      }).join('');

      pageInfo.innerText = `Showing ${start + 1} to ${Math.min(end, filteredSymbols.length)} of ${filteredSymbols.length} stocks`;
      updateSummaryCards();
    }

    function updateSummaryCards() {
      let gainers = 0, losers = 0;
      stockMap.forEach(item => {
        if (item.price >= item.prevClose) gainers++;
        else losers++;
      });
      document.getElementById("gainerCount").innerText = gainers;
      document.getElementById("loserCount").innerText = losers;
      document.getElementById("totalTickers").innerText = stockMap.size;
    }

    // 3. Data Engine: Simulation (Fallback when no WebSocket key is provided)
    setInterval(() => {
      // Pick 20 random stocks per batch to update
      for (let i = 0; i < 20; i++) {
        const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
        const item = stockMap.get(randomSym);
        const delta = (Math.random() - 0.49) * 0.75; // Random price shift
        
        item.price = Math.max(1, item.price + delta);
        item.volume += Math.floor(Math.random() * 50);
        item.flash = delta >= 0 ? 'up' : 'down';
        
        setTimeout(() => { item.flash = null; }, 400); // Clear highlight
        tickCount++;
      }
      renderTable();
    }, 300);

    // Track Updates per Second
    setInterval(() => {
      document.getElementById("ticksPerSec").innerText = tickCount;
      tickCount = 0;
    }, 1000);

    // 4. Live Finnhub WebSocket Integration
    document.getElementById("connectBtn").addEventListener("click", () => {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) {
        alert("Please enter a valid Finnhub API Key.");
        return;
      }

      if (socket) socket.close();

      socket = new WebSocket(`wss://ws.finnhub.io?token=${apiKey}`);

      socket.addEventListener('open', () => {
        document.getElementById("sourceStatus").innerText = "Finnhub Live WebSocket";
        document.getElementById("sourceStatus").className = "text-sm font-semibold text-emerald-400 mt-2";

        // Subscribe to top tickers (Finnhub Free WebSocket tier caps active subscriptions at 50 symbols)
        symbols.slice(0, 50).forEach(sym => {
          socket.send(JSON.stringify({'type': 'subscribe', 'symbol': sym}));
        });
      });

      socket.addEventListener('message', (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'trade' && msg.data) {
          msg.data.forEach(trade => {
            if (stockMap.has(trade.s)) {
              const item = stockMap.get(trade.s);
              item.price = trade.p;
              item.volume += trade.v;
              tickCount++;
            }
          });
          renderTable();
        }
      });
    });

    // 5. Search & Pagination Listeners
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const query = e.target.value.toUpperCase();
      filteredSymbols = symbols.filter(sym => {
        const item = stockMap.get(sym);
        return sym.includes(query) || item.name.toUpperCase().includes(query);
      });
      currentPage = 1;
      renderTable();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; renderTable(); }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentPage * pageSize < filteredSymbols.length) { currentPage++; renderTable(); }
    });

    // Initial Load
    renderTable();
  </script>
</body>
</html>
